# CI for scada-common, which runs on the published export at
# github.com/alexsmn/scada-common.
#
# STATIC ANALYSIS ONLY, DELIBERATELY. There is no build job because a public
# runner cannot assemble one: a standalone common build resolves the products it
# consumes as sibling checkouts (ADR 0011), and `net` — which common reaches
# through `core` — is `published = false` in tools/export/products.toml with a
# local destination. The workflow this replaced tried to paper over that by
# cloning the pre-monorepo repos and hand-assembling CMAKE_MODULE_PATH; it spent
# 3h33m per push building vcpkg dependencies from source and then failed at
# configure, on every push from 2026-05 to 2026-08. A build job comes back when
# the consumed products are published, not before.
#
# cppcheck here is the same configuration the build runs — see
# `scada_configure_cppcheck()` in build-support/ScadaProductBase.cmake, which
# reads this product's own .cppcheck-suppressions.

name: CI

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

jobs:
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cppcheck

    - name: Run cppcheck
      run: |
        cppcheck --enable=warning,performance,portability \
          --suppressions-list=.cppcheck-suppressions \
          --inline-suppr \
          --std=c++20 \
          -j2 \
          -I . \
          --output-file=cppcheck-report.txt \
          address_space/ common/ events/ model/ node_service/ opc/ \
          opcua_bridge/ timed_data/ vidicon/ test/ \
          2>&1 || true

        cat cppcheck-report.txt

        # Errors gate; warnings are reported but do not fail the job. cppcheck's
        # own --error-exitcode cannot express that split — it fires on any
        # finding — so the severity is read back out of the report.
        if grep -q "error:" cppcheck-report.txt; then
          echo "::error::cppcheck found errors"
          exit 1
        fi

    - name: Upload cppcheck report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cppcheck-report
        path: cppcheck-report.txt
        retention-days: 7
