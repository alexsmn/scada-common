<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="522px" preserveAspectRatio="none" style="width:1105px;height:522px;background:#FFFFFF;" version="1.1" viewBox="0 0 1105 522" width="1105px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><!--cluster pins--><g class="cluster" data-qualified-name="pins" data-source-line="7" id="ent0001"><rect fill="none" height="103.98" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="782" x="309.7" y="106.49"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="700" lengthAdjust="spacing" textLength="173.0859" x="614.157" y="122.0252">Pins (strong references)</text></g><!--entity fetch--><g class="entity" data-qualified-name="pins.fetch" data-source-line="8" id="ent0002"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="244.7109" x="325.34" y="141.49"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="164.1787" x="335.34" y="165.0252">In-flight fetch coroutine</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.7109" x="335.34" y="181.5134">(SpawnFetch captures the model)</text></g><!--entity pending--><g class="entity" data-qualified-name="pins.pending" data-source-line="9" id="ent0003"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="171.9834" x="604.7" y="141.49"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="139.1934" x="614.7" y="165.0252">Pending fetch queue</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151.9834" x="614.7" y="181.5134">(channel not open yet)</text></g><!--entity lru--><g class="entity" data-qualified-name="pins.lru" data-source-line="10" id="ent0004"><rect fill="#F1F1F1" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="264.9453" x="811.22" y="141.49"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="163.7139" x="821.22" y="165.0252">Keep-alive MRU window</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="244.9453" x="821.22" y="181.5134">(keep_alive_capacity_, default 4096)</text></g><!--entity service--><g class="entity" data-qualified-name="service" data-source-line="13" id="ent0005"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="157.8057" x="489.79" y="7"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="137.8057" x="499.79" y="30.5352">v3::NodeServiceImpl</text></g><!--entity registry--><g class="entity" data-qualified-name="registry" data-source-line="14" id="ent0006"><rect fill="#EEEEEE" height="52.9766" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="190.4063" x="99.49" y="141.49"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.7148" x="109.49" y="165.0252">NodeModelRegistry</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="170.4063" x="109.49" y="181.5134">map&lt;NodeId, weak_ptr&gt;</text></g><!--entity model--><g class="entity" data-qualified-name="model" data-source-line="15" id="ent0007"><rect fill="#F1F1F1" height="36.4883" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="151.79" x="463.8" y="298.19"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="131.79" x="473.8" y="321.7252">v3::NodeModelImpl</text></g><g class="entity" data-qualified-name="GMN15" data-source-line="26" id="ent0016"><path d="M6,288.47 L6,344.4016 A0,0 0 0 0 6,344.4016 L325.3906,344.4016 A0,0 0 0 0 325.3906,344.4016 L325.3906,298.47 L315.3906,288.47 L175.11,288.47 L189.58,194.82 L167.11,288.47 L6,288.47 A0,0 0 0 0 6,288.47" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M315.3906,288.47 L315.3906,298.47 L325.3906,298.47 L315.3906,288.47" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298.3906" x="12" y="306.0384">GetNodeModel(id): lock or create + touch MRU.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.7568" x="12" y="321.3489">FindNodeModel(id): lookup only &#8212; update and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="282.0518" x="12" y="336.6595">notification paths must never create models.</text></g><g class="entity" data-qualified-name="GMN18" data-source-line="32" id="ent0019"><path d="M386.23,405.4 L386.23,507.2633 A0,0 0 0 0 386.23,507.2633 L693.1538,507.2633 A0,0 0 0 0 693.1538,507.2633 L693.1538,415.4 L683.1538,405.4 L543.7,405.4 L539.7,334.9 L535.7,405.4 L386.23,405.4 A0,0 0 0 0 386.23,405.4" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M683.1538,405.4 L683.1538,415.4 L693.1538,415.4 L683.1538,405.4" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="263.853" x="392.23" y="422.9684">Dropping the last pin destroys the model.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="273.0571" x="392.23" y="438.2789">A fetched subtree therefore unwinds as the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.1978" x="392.23" y="453.5895">MRU window evicts it, not when a parent</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.7012" x="392.23" y="468.9">dies. NodeDeleted drops the keep-alive pin</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="285.9238" x="392.23" y="484.2105">and tombstones the model for any remaining</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="44.6685" x="392.23" y="499.5211">holder.</text></g><!--link fetch to model--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" data-link-type="dependency" data-source-line="17" id="lnk8"><path d="M487.93,194.75 C499.01,203.6 510.06,214.36 517.7,226.47 C531.62,248.53 536.2359,273.8645 538.1159,292.7945" fill="none" id="fetch-to-model" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="538.61,297.77,541.701,288.4188,538.1159,292.7945,533.7401,289.2094,538.61,297.77" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link pending to model--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" data-link-type="dependency" data-source-line="18" id="lnk9"><path d="M664.05,194.82 C633.4,224.55 587.5189,269.0487 561.1589,294.6187" fill="none" id="pending-to-model" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="557.57,298.1,566.8151,294.7047,561.1589,294.6187,561.245,288.9625,557.57,298.1" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link lru to model--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" data-link-type="dependency" data-source-line="19" id="lnk10"><path d="M872.4,194.82 C790.74,224.43 663.8305,270.4254 593.1005,296.0754" fill="none" id="lru-to-model" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="588.4,297.78,598.2245,298.4721,593.1005,296.0754,595.4971,290.9513,588.4,297.78" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="201.4302" x="778.88" y="247.5384">the only pin once a fetch settles</text></g><!--link service to registry--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="20" id="lnk11"><path d="M489.5,42.58 C437.25,54.74 367.95,73.54 309.7,98.49 C282.67,110.06 258.4804,124.2077 236.6604,138.2977" fill="none" id="service-to-registry" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="232.46,141.01,242.1906,139.4881,236.6604,138.2977,237.8508,132.7675,232.46,141.01" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="112.7471" x="372.74" y="87.0584">owns (shared_ptr)</text></g><!--link service to lru--><g class="link" data-entity-1="ent0005" data-entity-2="ent0004" data-link-type="dependency" data-source-line="21" id="lnk12"><path d="M630.49,43.95 C676.08,57.52 739.37,77.45 793.7,98.49 C826.53,111.21 857.9234,125.3652 886.3734,138.8752" fill="none" id="service-to-lru" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="890.89,141.02,884.4759,133.5461,886.3734,138.8752,881.0442,140.7727,890.89,141.02" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="32.6968" x="770.71" y="87.0584">owns</text></g><!--link model to registry--><g class="link" data-entity-1="ent0007" data-entity-2="ent0006" data-link-type="dependency" data-source-line="22" id="lnk13"><path d="M483.12,297.8 C457.12,288.3 426.6,275.08 401.7,258.47 C384.96,247.3 387.73,235.38 369.7,226.47 C345.58,214.55 335.63,225.63 309.7,218.47 C288.43,212.59 270.5101,205.6507 251.1201,196.9307" fill="none" id="model-to-registry" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="246.56,194.88,253.1276,202.2194,251.1201,196.9307,256.4088,194.9233,246.56,1